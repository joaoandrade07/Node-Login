services:
  db:
    image: mariadb:latest
    container_name: mariadb
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: baco_de_dados
      MYSQL_USER: user
      MYSQL_PASSWORD: 12345678
    volumes:
      - ./banco:/var/lib/mysql